<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Rock Paper Scissors</h1>
      <div class="score">
        <div class="score-box">
          <h2>Player</h2>
          <span id="player-score">0</span>
        </div>
        <div class="score-box">
          <h2>Computer</h2>
          <span id="computer-score">0</span>
        </div>
      </div>
      <div class="choices">
        <button class="choice-btn" data-choice="rock">🪨</button>
        <button class="choice-btn" data-choice="paper">📄</button>
        <button class="choice-btn" data-choice="scissors">✂️</button>
      </div>
      <div class="game-area">
        <div class="player-choice">
          <h3>You chose:</h3>
          <div id="player-display" class="choice-display"></div>
        </div>
        <div class="result">
          <h3 id="result-text">Make your choice!</h3>
        </div>
        <div class="computer-choice">
          <h3>Computer chose:</h3>
          <div id="computer-display" class="choice-display"></div>
        </div>
      </div>
      <button id="reset-btn">Reset Game</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
